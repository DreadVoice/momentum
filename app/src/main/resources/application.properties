spring.config.import=optional:file:../.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.ratelimit.capacity=${RATELIMIT_CAPACITY:5}
app.ratelimit.period-seconds=${RATELIMIT_PERIOD_SECONDS:60}
app.ratelimit.trust-forwarded-header=${RATELIMIT_TRUST_FORWARDED:true}
spring.data.web.pageable.max-page-size=100

server.tomcat.threads.max=${TOMCAT_MAX_THREADS:16}
server.tomcat.accept-count=50
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
