databases:
  - name: momentum-db
    databaseName: momentum
    user: momentum
    plan: free
    region: singapore

services:
  - type: web
    name: momentum-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: app
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:

      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        fromDatabase:
          name: momentum-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: momentum-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: momentum-ui
    runtime: static
    region: singapore
    rootDir: ui
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
